name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # So a deploy can be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  # Required by deploy-pages: it authenticates to Pages with a short-lived
  # OIDC token rather than a stored secret.
  id-token: write

# One deploy at a time, and never cancel one that has started — a half-finished
# deployment would leave the live site in whatever state it got to.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The headless checks, before anything is published. They take seconds,
      # and a build log cannot tell you that the sky has a bald patch at the
      # poles, that a unit is full of holes, or that the controls send you the
      # opposite way from the one they name. The build passing is not on its own
      # a reason to deploy.
      - name: Check the sky is even and stays with you
        run: npm run verify:starfield

      - name: Check the units are solid
        run: npm run verify:units

      - name: Check the controls and the camera
        run: npm run verify:steering

      - name: Check nothing large arrives without warning
        run: npm run verify:approach

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # Typechecks first, then bundles. BASE_PATH comes from GitHub rather than
      # being written down, so this keeps working if the repository is renamed.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
