<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stardust</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--void); color:var(--ink); font-family:var(--font-ui); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; inset:0 0 auto 0; height:152px; }
  .art svg { display:block; }
  .navy { fill:var(--armor-navy); }
  .white { fill:var(--armor-white); }
  .red { fill:var(--armor-red); }
  .gold, .vent { fill:var(--armor-gold); }
  .sig { fill:var(--signal); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-5); max-width:900px; }
  .name { margin:0; font-family:var(--font-display); font-weight:400; font-size:60px; line-height:.95; letter-spacing:.12em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-dim); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 960 152" width="960" height="152">
<!--
  blocks      armor-navy 296x112 (the core) · armor-white 232 + 264 bleeding off the right · armor-red 80 · armor-gold 56 — a full-width band, about 32% of 960x288
  arrangement the top-band skeleton: one strip of armour plates, space-2 seams between them, like a mech's shoulder line
  pattern     gold vent slots, from "Tricolour and gold, used like paint": six skewed armor-gold vents cut into the navy core, plus the 1px signal rule of a window opening
  scales      seams space-2 (8px); corners cut-lg 24px on large plates and cut-md 14px on small; vent pitch 40px; rule 1px
-->
<polygon class="navy" points="56,24 328,24 328,112 304,136 32,136 32,48"/>
<polygon class="white" points="360,24 568,24 568,112 544,136 336,136 336,48"/>
<polygon class="red" points="590,24 656,24 656,122 642,136 576,136 576,38"/>
<polygon class="gold" points="678,24 720,24 720,122 706,136 664,136 664,38"/>
<polygon class="white" points="752,24 992,24 992,112 968,136 728,136 728,48"/>
<polygon class="vent" points="82,96 102,96 92,120 72,120"/>
<polygon class="vent" points="122,96 142,96 132,120 112,120"/>
<polygon class="vent" points="162,96 182,96 172,120 152,120"/>
<polygon class="vent" points="202,96 222,96 212,120 192,120"/>
<polygon class="vent" points="242,96 262,96 252,120 232,120"/>
<polygon class="vent" points="282,96 302,96 292,120 272,120"/>
<rect class="sig" x="336" y="144" width="656" height="1"/>
<rect class="sig" x="32" y="144" width="120" height="1"/>
</svg>
</div>
<div class="words">
<h1 class="name">Stardust</h1>
<p class="tag">A quiet sector to drift through. Pick a frame, point it at the stars.</p>
</div>
</div>
</body>
</html>
