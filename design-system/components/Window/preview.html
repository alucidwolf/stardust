<!doctype html>
<html>
<head><meta charset="utf-8"><title>Window</title>
<style>html,body{margin:0} body{background:var(--void);padding:20px} .row{display:flex;gap:16px;flex-wrap:wrap;align-items:center} .replay{margin-top:14px}</style>
</head>
<body class="sd-root">
<div class="sd-window-wrap" data-state="open"><div class="sd-window sd-plate sd-plate--armour" role="dialog" aria-label="Select unit"><div class="sd-window__bar"><h2 class="sd-window__title">Select unit</h2><span class="sd-micro">SD-SYS 2.0 // HANGAR 03</span></div><div class="sd-window__body"><div class="sd-window__grid"><button class="sd-card sd-plate sd-plate--armour" type="button" aria-pressed="false"><span class="sd-card__top"><span class="sd-micro">UNIT XR-7</span><span class="sd-key sd-plate">1</span></span><span class="sd-card__name">Wayfarer</span><span class="sd-card__class">mech</span><span class="sd-card__blurb">Long legs, folded wings. Drifts like it has somewhere better to be.</span></button><button class="sd-card sd-plate sd-plate--armour" type="button" aria-pressed="true"><span class="sd-card__top"><span class="sd-micro">UNIT HV-2</span><span class="sd-key sd-plate">2</span></span><span class="sd-card__name">Bastion</span><span class="sd-card__class">mech</span><span class="sd-card__blurb">Built like a cathedral. Turns like one too.</span></button><button class="sd-card sd-plate sd-plate--armour" type="button" aria-pressed="false"><span class="sd-card__top"><span class="sd-micro">UNIT SW-4</span><span class="sd-key sd-plate">3</span></span><span class="sd-card__name">Swordtail</span><span class="sd-card__class sd-card__class--ship">ship</span><span class="sd-card__blurb">All engine and nerve. Leaves a line of light behind it.</span></button><button class="sd-card sd-plate sd-plate--armour" type="button" aria-pressed="false"><span class="sd-card__top"><span class="sd-micro">UNIT FR-9</span><span class="sd-key sd-plate">4</span></span><span class="sd-card__name">Old Tuesday</span><span class="sd-card__class sd-card__class--ship">ship</span><span class="sd-card__blurb">A freighter with a kitchen and a leak. Nobody's in a hurry.</span></button></div><p class="sd-window__foot">The flight carries on. You keep your heading and your speed.</p></div><span class="sd-window__tick sd-window__tick--tr"></span><span class="sd-window__tick sd-window__tick--bl"></span></div></div><button class="sd-button sd-plate replay" type="button" id="rp">Replay</button>
<script>
var el=document.querySelector('.sd-window-wrap');document.getElementById('rp').onclick=function(){el.removeAttribute('data-state');void el.offsetWidth;el.setAttribute('data-state','open');};
</script>
</body>
</html>
